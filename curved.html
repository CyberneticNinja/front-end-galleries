<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio — Curved Gallery</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #1d1d1f;
      --muted: #6b6b70;
      --peach: #f6dccf;
      --sky: #d4e4f7;
      --lilac: #e2dcf5;
      --mint: #d8ecdc;
      --grey: #e6e6e6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--ink); overflow: hidden;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    }

    /* ---- Header ---- */
    header { display: flex; align-items: center; padding: 1.25rem 2rem; position: relative; z-index: 10; }
    .logo { display: flex; align-items: center; gap: .75rem; font-weight: 600; }
    .logo i { width: 40px; height: 26px; border-radius: 8px; background: var(--peach); display: block; }
    nav { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 2.25rem; }
    nav a { color: var(--muted); text-decoration: none; font-size: .95rem; }
    nav a:hover { color: var(--ink); }
    .start { margin-left: auto; background: var(--mint); color: var(--ink); text-decoration: none;
      padding: .65rem 1.2rem; border-radius: 10px; font-size: .9rem; font-weight: 500; }

    /* ---- Hero text ---- */
    .hero { text-align: center; padding: 3vh 1rem 0; position: relative; z-index: 10; }
    .badge { display: inline-block; background: var(--peach); padding: .45rem 1rem; border-radius: 8px;
      font-size: .85rem; color: #5a4136; }
    .hero h1 { font-size: clamp(2.6rem, 6.5vw, 5.5rem); line-height: 1; letter-spacing: -.03em;
      margin: 1.25rem 0 .9rem; font-weight: 700; }
    .hero p { color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.2rem); margin: 0 auto 1.6rem; max-width: 520px; }
    .actions { display: flex; gap: 1rem; justify-content: center; }
    .btn { font: inherit; padding: .8rem 1.8rem; border-radius: 10px; text-decoration: none; font-weight: 500; font-size: .95rem; }
    .btn.dark { background: var(--ink); color: #fff; }
    .btn.light { background: var(--grey); color: var(--ink); }

    /* ---- The curved gallery ---- */
    .stage {
      flex: 1; min-height: 300px; position: relative;
      cursor: grab; touch-action: pan-y; user-select: none;
      /* perspective is set from JS so it scales with the screen */
    }
    .stage.dragging { cursor: grabbing; }
    .ring { position: absolute; left: 50%; top: 50%; transform-style: preserve-3d; }

    .card {
      position: absolute; left: 0; top: 0;
      border-radius: 14px; overflow: hidden;
      backface-visibility: hidden;
      transition: opacity .2s linear;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .card figcaption {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 2.5rem 1rem 1rem;
      background: linear-gradient(transparent, rgba(0,0,0,.65)); color: #fff;
      font-size: 1.1rem; line-height: 1.25; opacity: 0; transition: opacity .25s ease;
    }
    .card figcaption small { display: block; opacity: .8; font-size: .85rem; margin-top: .2rem; }
    .card:hover figcaption { opacity: 1; }

    .now-showing { position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; margin: 0; padding: 0 1rem;
      font-size: .9rem; color: var(--muted); pointer-events: none; }

    /* ---- Footer ---- */
    footer { display: flex; justify-content: space-between; padding: 1rem 2rem 1.25rem; font-size: .8rem;
      color: var(--muted); position: relative; z-index: 10; }
    footer a { color: inherit; }

    @media (max-width: 760px) {
      nav { display: none; }
      header { padding: 1rem; }
      footer { padding: .75rem 1rem 1rem; font-size: .7rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><i></i> Studio</div>
    <nav>
      <a href="#">Work</a>
      <a href="#">Studio</a>
      <a href="#">Journal</a>
      <a href="#">Contact</a>
    </nav>
    <a class="start" href="#">Start a project</a>
  </header>

  <section class="hero">
    <span class="badge">Brand &amp; editorial studio</span>
    <h1>Stories told in color</h1>
    <p>A small studio building identities and websites for people who want to be remembered.</p>
    <div class="actions">
      <a class="btn dark" href="#">See our work</a>
      <a class="btn light" href="#">About us</a>
    </div>
  </section>

  <div class="stage" id="stage" aria-label="Gallery. Drag to rotate.">
    <div class="ring" id="ring"></div>
    <p class="now-showing" id="now-showing"></p>
  </div>

  <footer>
    <span>&copy; 2026 Studio</span>
    <span>Artwork: public domain, via <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a></span>
  </footer>

  <script src="js/curved.js"></script>
</body>
</html>
