<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Fan</title>
  <style>
    :root {
      --card-w: clamp(140px, 18vw, 220px);
      --card-h: calc(var(--card-w) * 1.4);
      --speed: .55s;
      --ease: cubic-bezier(.34, 1.4, .64, 1);   /* slight overshoot, like a flick of the wrist */

      /* Resting hand: slightly fanned */
      --rot: 5deg;      /* rotation per card */
      --shift: 10px;    /* sideways spread per card */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 40%, #1f4a36 0%, #0f2a1e 60%, #08170f 100%);
      color: #f3efe4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; place-items: center; overflow: hidden;
    }

    .table { display: grid; justify-items: center; gap: 1.5rem; }
    .hint { font-size: .85rem; opacity: .65; letter-spacing: .04em; }

    /* The hand: a big invisible hover area so the fan doesn't flicker as cards move */
    .hand {
      position: relative;
      width: calc(var(--card-w) * 4.2);
      height: calc(var(--card-h) * 1.55);
      display: grid; place-items: end center;
      padding-bottom: calc(var(--card-h) * 0.1);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    /* Fully fanned when hovered (or tapped open on touch screens) */
    .hand:hover, .hand.is-open {
      --rot: 17deg;
      --shift: calc(var(--card-w) * 0.32);
    }

    .card {
      --lift: 0px;
      position: absolute; bottom: calc(var(--card-h) * 0.1);
      width: var(--card-w); height: var(--card-h);
      border-radius: 14px; overflow: hidden;
      background: #fbf8f1; padding: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,.35), 0 2px 4px rgba(0,0,0,.25);
      /* origin well below the card = pivot in the "palm", so rotation makes an arc */
      transform-origin: 50% 160%;
      transform:
        translateX(calc(var(--t) * var(--shift)))
        rotate(calc(var(--t) * var(--rot)))
        translateY(var(--lift));
      transition: transform var(--speed) var(--ease), box-shadow .3s ease;
      transition-delay: calc(var(--i) * 25ms);
    }
    .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }

    /* Corner indices, like a playing card */
    .card .idx {
      position: absolute; font-weight: 800; font-size: calc(var(--card-w) * .11); line-height: 1;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
    }
    .card .idx.tl { top: 16px; left: 16px; }
    .card .idx.br { bottom: 16px; right: 16px; transform: rotate(180deg); }

    .card .label {
      position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 2.2rem .7rem .7rem;
      border-radius: 0 0 8px 8px; background: linear-gradient(transparent, rgba(0,0,0,.7));
      font-size: .8rem; line-height: 1.3; opacity: 0; transition: opacity .25s ease;
    }
    .card .label small { display: block; opacity: .75; font-size: .68rem; margin-top: .15rem; }

    /* Hovering a single card while fanned lifts it out of the hand */
    .hand:hover .card:hover, .hand.is-open .card.is-picked {
      --lift: calc(var(--card-h) * -0.14);
      z-index: 10;
      box-shadow: 0 25px 45px rgba(0,0,0,.45), 0 4px 8px rgba(0,0,0,.25);
      transition-delay: 0s;
    }
    .hand:hover .card:hover .label, .hand.is-open .card.is-picked .label { opacity: 1; }

    .credit { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: .7rem; opacity: .5; }
    .credit a { color: inherit; }

    @media (prefers-reduced-motion: reduce) { :root { --speed: .01s; } .card { transition-delay: 0s; } }
  </style>
</head>
<body>
  <div class="table">
    <div class="hand" id="hand" aria-label="A hand of photo cards"></div>
    <p class="hint" id="hint">Hover to fan the cards</p>
  </div>

  <p class="credit">
    Photos from Unsplash by
    <a href="https://unsplash.com/photos/wooden-boardwalk-through-a-grassy-field-towards-mountains-Bji0KgtUtVU" target="_blank" rel="noopener">Max Volkov</a>,
    <a href="https://unsplash.com/photos/calm-lake-with-tall-pine-trees-ovr7rwAsttg" target="_blank" rel="noopener">Bruno da Costa</a>,
    <a href="https://unsplash.com/photos/several-jellyfish-float-in-dark-water-DunrltDuz9k" target="_blank" rel="noopener">Rafael Garcin</a> and
    <a href="https://unsplash.com/photos/mist-over-coastal-cliffs-in-sidmouth-DHjbBmCjEY4" target="_blank" rel="noopener">Red Zeppelin</a>
  </p>

  <script src="js/card-fan.js"></script>
</body>
</html>
