<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taurus — 360° Showroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --ink: #f2f0ea;
      --muted: #8d8b86;
      --gold: #c9a24a;
      --accent: #f2b705;          /* changes with the selected model */
      --line: rgba(255,255,255,.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--ink); font-family: "Inter", system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ---- Header ---- */
    header { display: flex; align-items: center; justify-content: space-between; padding: 1.4rem 3rem; position: relative; z-index: 5; }
    .brand { display: flex; align-items: center; gap: .9rem; text-decoration: none; color: var(--ink); }
    .brand svg { width: 42px; height: 42px; }
    .brand span { font-family: "Syncopate", sans-serif; font-weight: 700; letter-spacing: .35em; font-size: 1.05rem; }
    nav { display: flex; gap: 2.2rem; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    nav a { color: inherit; text-decoration: none; }
    nav a:hover { color: var(--ink); }

    /* ---- Showroom ---- */
    .showroom { position: relative; display: grid; justify-items: center; padding: 0 1.5rem 2rem; }

    /* Huge outlined model name behind the car */
    .bg-name {
      position: absolute; top: 4%; left: 0; right: 0; text-align: center; pointer-events: none; user-select: none;
      font-family: "Syncopate", sans-serif; font-weight: 700; font-size: clamp(3.5rem, 15vw, 14rem); line-height: 1;
      color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.12); letter-spacing: .04em;
      transition: opacity .4s ease;
    }

    .stage {
      position: relative; width: min(1100px, 100%); aspect-ratio: 16 / 9; margin-top: clamp(1rem, 6vw, 4rem);
      cursor: grab; touch-action: pan-y; user-select: none;
    }
    .stage.dragging { cursor: grabbing; }
    /* Pool of light on the floor, tinted by the model colour */
    .stage::before {
      content: ""; position: absolute; left: 10%; right: 10%; bottom: 8%; height: 34%;
      background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 70%);
      filter: blur(10px); transition: background .6s ease;
    }
    .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none;
      transition: opacity .35s ease; }
    .stage img.fading { opacity: 0; }

    .loading { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); width: 180px; height: 2px;
      background: var(--line); border-radius: 2px; overflow: hidden; transition: opacity .3s; }
    .loading span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .loading.done { opacity: 0; }

    /* 360 hint + angle slider */
    .controls { display: flex; align-items: center; gap: 1rem; width: min(560px, 100%); margin-top: -.5rem; color: var(--muted); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }
    .controls input[type="range"] { flex: 1; accent-color: var(--accent); }
    .controls button { font: inherit; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 999px;
      width: 34px; height: 34px; cursor: pointer; font-size: 1rem; letter-spacing: 0; }
    .controls button:hover { border-color: var(--ink); }
    .badge360 { border: 1px solid var(--line); border-radius: 999px; padding: .35rem .7rem; white-space: nowrap; }

    /* ---- Model info ---- */
    .info { width: min(1100px, 100%); display: grid; grid-template-columns: 1.1fr 1.4fr; gap: 3rem; margin-top: 2.5rem; align-items: end; }
    .eyebrow { color: var(--accent); font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; transition: color .6s; }
    h1 { font-family: "Syncopate", sans-serif; font-weight: 700; font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: .08em; margin: .5rem 0 .6rem; }
    .tagline { color: var(--muted); line-height: 1.6; margin: 0 0 1.6rem; max-width: 420px; }
    .cta { display: inline-flex; gap: .6rem; align-items: center; background: var(--ink); color: #111; text-decoration: none;
      padding: .9rem 1.5rem; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
    .cta:hover { background: var(--accent); }

    .specs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
    .spec { padding: 1.1rem 0 0; }
    .spec b { display: block; font-family: "Syncopate", sans-serif; font-size: clamp(1.1rem, 2vw, 1.5rem); font-weight: 700; }
    .spec small { color: var(--muted); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; }

    /* Model picker */
    .models { display: flex; gap: .75rem; justify-content: center; margin: 3rem 0 1rem; flex-wrap: wrap; }
    .model { font: inherit; display: flex; align-items: center; gap: .7rem; cursor: pointer; color: var(--muted);
      background: none; border: 1px solid var(--line); padding: .7rem 1.1rem .7rem .8rem; font-size: .75rem;
      letter-spacing: .16em; text-transform: uppercase; }
    .model i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
    .model[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }

    footer { text-align: center; color: var(--muted); font-size: .7rem; padding: 1rem 1rem 2rem; line-height: 1.6; }

    @media (max-width: 820px) {
      header { padding: 1rem 1.25rem; } nav { display: none; }
      .info { grid-template-columns: 1fr; gap: 1.5rem; margin-top: 1.5rem; }
      .specs { grid-template-columns: repeat(2, 1fr); }
      .controls { font-size: .65rem; }
    }
    @media (prefers-reduced-motion: reduce) { .stage img, .bg-name { transition: none; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#" aria-label="Taurus home">
      <!-- Original emblem: geometric bull head in a gold hexagon -->
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5" fill="#111" stroke="#c9a24a" stroke-width="2.5"/>
        <path d="M13 15 Q14 27 25 28" fill="none" stroke="#c9a24a" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M51 15 Q50 27 39 28" fill="none" stroke="#c9a24a" stroke-width="3.2" stroke-linecap="round"/>
        <polygon points="20,29 24,26 40,26 44,29 39,31 37,43 32,50 27,43 25,31" fill="#c9a24a"/>
        <path d="M27 33 L30 34 M37 33 L34 34" stroke="#111" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="29.5" cy="45" r="1" fill="#111"/><circle cx="34.5" cy="45" r="1" fill="#111"/>
      </svg>
      <span>TAURUS</span>
    </a>
    <nav><a href="#">Models</a><a href="#">Configure</a><a href="#">Heritage</a><a href="#">Dealers</a></nav>
  </header>

  <main class="showroom">
    <div class="bg-name" id="bg-name" aria-hidden="true">TORO</div>

    <div class="stage" id="stage" role="img" aria-label="360 degree view of the car. Drag to turn it.">
      <img id="car" alt="" draggable="false">
      <div class="loading" id="loading"><span id="bar"></span></div>
    </div>

    <div class="controls">
      <button type="button" id="prev" aria-label="Turn left">&#8249;</button>
      <input type="range" id="angle" min="0" max="35" step="1" value="0" aria-label="Viewing angle">
      <button type="button" id="next" aria-label="Turn right">&#8250;</button>
      <span class="badge360">Drag · 360°</span>
    </div>

    <div class="models" id="models" role="group" aria-label="Choose a model"></div>

    <section class="info">
      <div>
        <div class="eyebrow" id="eyebrow">V12 · Coupé</div>
        <h1 id="name">Toro</h1>
        <p class="tagline" id="tagline"></p>
        <a class="cta" href="#">Configure yours &#8594;</a>
      </div>
      <div class="specs" id="specs"></div>
    </section>
  </main>

  <footer>
    Taurus is a fictional brand. Cars modelled and rendered in code (Three.js), then shown as a 36-frame image sequence.
  </footer>

  <script src="js/cars-360.js"></script>
</body>
</html>
